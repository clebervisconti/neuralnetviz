# Base compose stack — used directly for LOCAL test (Docker Desktop).
#
#   cp .env.example .env   # fill SPLUNK_ACCESS_TOKEN
#   docker compose up --build
#   open http://localhost:8801
#
# On the VPS this base is layered with docker-compose.vps.yml (GHCR image,
# loopback bind, restart policy):
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# The app exports OTLP to the otel-collector sidecar, which forwards traces +
# metrics to Splunk Observability Cloud (realm from .env).

services:
  app:
    build: .
    image: ghcr.io/clebervisconti/neuralnetviz:${IMAGE_TAG:-local}
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      OTEL_SERVICE_NAME: neuralnetviz
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Name the HTTP exporter explicitly. splunk-opentelemetry 1.21.0 hardcodes
      # the generic `otlp` traces name to the gRPC exporter (ignores
      # OTEL_EXPORTER_OTLP_PROTOCOL), and only the proto-http exporter is shipped
      # — so `otlp` crashes at startup. `otlp_proto_http` selects the right one.
      OTEL_TRACES_EXPORTER: otlp_proto_http
      OTEL_METRICS_EXPORTER: otlp_proto_http
      OTEL_LOGS_EXPORTER: none
      # deployment.environment is overridden to "production" by the VPS override.
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.version=0.2.0
    ports:
      - "8801:8801"
    restart: unless-stopped

  otel-collector:
    image: quay.io/signalfx/splunk-otel-collector:0.154.2
    command: ["--config=/etc/otel/collector/config.yaml"]
    environment:
      SPLUNK_ACCESS_TOKEN: ${SPLUNK_ACCESS_TOKEN:?set SPLUNK_ACCESS_TOKEN in .env}
      SPLUNK_REALM: ${SPLUNK_REALM:-us1}
      SPLUNK_MEMORY_TOTAL_MIB: "256"
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otel/collector/config.yaml:ro
    restart: unless-stopped

# Lean Splunk OpenTelemetry Collector config for the NeuraNetViz sidecar.
#
# Scope: receive OTLP from the app container ONLY and forward app traces +
# metrics to Splunk Observability Cloud. It deliberately does NOT scrape
# hostmetrics — on the VPS the host-level splunk-otel-collector owns host
# telemetry; locally we don't want host noise from a laptop.
#
# Secrets come from the environment (compose passes them from .env):
#   SPLUNK_ACCESS_TOKEN  — org ingest token (secret)
#   SPLUNK_REALM         — e.g. us1
# The signalfx exporter's api_url/ingest_url are derived from the realm.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  memory_limiter:
    check_interval: 2s
    limit_mib: 128
  resource_detection:
    detectors: [env, system]
    override: false

exporters:
  # Traces → Splunk APM via OTLP/HTTP. SAPM was removed in newer collectors;
  # this mirrors the working host-collector config (agent_config.yaml). The
  # Splunk distro names this exporter `otlp_http` (the `otlphttp` alias is
  # deprecated).
  otlp_http:
    traces_endpoint: "https://ingest.${SPLUNK_REALM}.signalfx.com/v2/trace/otlp"
    headers:
      "X-SF-Token": "${SPLUNK_ACCESS_TOKEN}"
  # Metrics → Splunk Infrastructure Monitoring.
  signalfx:
    access_token: "${SPLUNK_ACCESS_TOKEN}"
    realm: "${SPLUNK_REALM}"

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlp_http]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [signalfx]

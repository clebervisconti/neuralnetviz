name: build-and-push

# Build the container image and publish it to GitHub Container Registry (GHCR).
# Source of truth stays on GitHub; the VPS only pulls the resulting image.
#
# Pipeline: push to main (or manual dispatch) -> build linux/amd64 image ->
# push ghcr.io/clebervisconti/neuralnetviz:{latest, <git-sha>}.
# The VPS deploy (docker compose pull + up) is triggered separately once the
# image is validated locally — see deploy/ and the app-deployment-orchestrator
# Shape E reference.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/neuralnetviz

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
